spring.datasource.url=${DB_URL:jdbc:h2:file:./data/diagauto;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.config.import=optional:file:./stripe-local.properties,optional:file:./diagAuto-backend/stripe-local.properties,optional:file:../diagAuto-backend/stripe-local.properties
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.frontend-url=${FRONTEND_URL:http://localhost:4200}
